name: Re-encode PWA icons

on:
  push:
    paths:
      - ".github/workflows/reencode-icons.yml"

permissions:
  contents: write

jobs:
  reencode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Re-encode icons as clean RGB PNG
        run: |
          python - <<'PY'
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True

          for path, expected in [
              ("icon-192.png", (192, 192)),
              ("icon-512.png", (512, 512)),
          ]:
              with Image.open(path) as im:
                  im.load()
                  if im.size != expected:
                      raise SystemExit(f"{path}: expected {expected}, got {im.size}")
                  rgb = im.convert("RGB")
                  rgb.save(path, "PNG", optimize=True)

          ImageFile.LOAD_TRUNCATED_IMAGES = False
          for path, expected in [
              ("icon-192.png", (192, 192)),
              ("icon-512.png", (512, 512)),
          ]:
              with Image.open(path) as im:
                  im.load()
                  if im.size != expected or im.mode != "RGB":
                      raise SystemExit(f"{path}: validation failed: {im.size} {im.mode}")
                  print(path, im.size, im.mode)
          PY

      - name: Commit repaired icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          git diff --cached --quiet && exit 0
          git commit -m "Repair PWA icon PNG encoding"
          git push
