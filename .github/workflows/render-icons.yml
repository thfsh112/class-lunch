name: Rebuild PWA icons from valid 192 source

on:
  push:
    paths:
      - ".github/workflows/render-icons.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Extract known-good historical 192 icon
        run: git show 6a54fbf0171ef84e1466d5534cab4a746c00bd78:install-icon-192.png > /tmp/icon-source-192.png

      - name: Rebuild and validate PWA icons
        run: |
          python - <<'PY'
          from PIL import Image, ImageStat

          with Image.open("/tmp/icon-source-192.png") as src:
              src.load()
              rgb = src.convert("RGB")
              print("source", src.size, src.mode, rgb.getextrema(), [round(x,1) for x in ImageStat.Stat(rgb).mean])

          if rgb.size != (192, 192):
              raise SystemExit(f"source size is {rgb.size}, expected 192x192")

          for size in (192, 512):
              out = rgb if size == 192 else rgb.resize((size, size), Image.Resampling.LANCZOS)
              path = f"icon-{size}.png"
              out.save(path, "PNG", optimize=True)

              with Image.open(path) as check:
                  check.load()
                  extrema = check.getextrema()
                  mean = [round(x,1) for x in ImageStat.Stat(check).mean]
                  spread = sum(hi - lo for lo, hi in extrema)
                  if check.size != (size, size) or check.mode != "RGB" or spread < 60:
                      raise SystemExit(f"{path}: validation failed {check.size} {check.mode} {extrema}")
                  print("OK", path, check.size, check.mode, extrema, mean)
          PY

      - name: Commit rebuilt icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          git diff --cached --quiet && exit 0
          git commit -m "Restore PWA icons from valid historical source"
          git push
