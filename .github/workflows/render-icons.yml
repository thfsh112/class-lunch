name: Render clean PWA icons

on:
  push:
    paths:
      - "icon-source-192.svg"
      - "icon-source-512.svg"
      - ".github/workflows/render-icons.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install render tools
        run: python -m pip install --quiet cairosvg pillow

      - name: Render and validate icons
        run: |
          python - <<'PY'
          import io, math
          import cairosvg
          from PIL import Image, ImageStat

          jobs = [
              ("icon-source-192.svg", "icon-192.png", 192),
              ("icon-source-512.svg", "icon-512.png", 512),
          ]

          for src, out, size in jobs:
              png = cairosvg.svg2png(url=src, output_width=size, output_height=size)
              im = Image.open(io.BytesIO(png)).convert("RGB")
              if im.size != (size, size):
                  raise SystemExit(f"{out}: wrong size {im.size}")
              stat = ImageStat.Stat(im)
              extrema = im.getextrema()
              # reject blank / near-uniform output
              spread = sum(hi - lo for lo, hi in extrema)
              if spread < 60:
                  raise SystemExit(f"{out}: image looks blank/uniform, extrema={extrema}")
              im.save(out, "PNG", optimize=True)
              # Re-open without tolerant mode to verify a clean file.
              with Image.open(out) as check:
                  check.load()
                  if check.size != (size, size) or check.mode != "RGB":
                      raise SystemExit(f"{out}: validation failed {check.size} {check.mode}")
              print(out, im.size, im.mode, extrema, [round(x,1) for x in stat.mean])
          PY

      - name: Commit rendered icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          git diff --cached --quiet && exit 0
          git commit -m "Render clean PWA icons from SVG sources"
          git push
