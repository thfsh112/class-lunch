name: Rebuild PWA icons from original source

on:
  push:
    paths:
      - ".github/workflows/render-icons.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Extract original icon source
        run: git show 3503179c6e7ee015b6bee949506a91cd9844bc58:icon.png > /tmp/icon-source.png

      - name: Rebuild and validate PWA icons
        run: |
          python - <<'PY'
          from PIL import Image, ImageStat

          src = Image.open("/tmp/icon-source.png")
          src.load()
          print("source", src.size, src.mode, src.getextrema())

          rgb = src.convert("RGB")
          spread = sum(hi - lo for lo, hi in rgb.getextrema())
          if spread < 60:
              raise SystemExit("original icon source looks blank/uniform")

          for size in (192, 512):
              out = rgb.resize((size, size), Image.Resampling.LANCZOS)
              path = f"icon-{size}.png"
              out.save(path, "PNG", optimize=True)

              with Image.open(path) as check:
                  check.load()
                  stat = ImageStat.Stat(check)
                  extrema = check.getextrema()
                  spread = sum(hi - lo for lo, hi in extrema)
                  if check.size != (size, size) or check.mode != "RGB" or spread < 60:
                      raise SystemExit(f"{path}: validation failed {check.size} {check.mode} {extrema}")
                  print(path, check.size, check.mode, extrema, [round(x,1) for x in stat.mean])
          PY

      - name: Commit rebuilt icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild PWA icons from original source image"
          git push
