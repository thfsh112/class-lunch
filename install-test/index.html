<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7e7c6">
<title>班級訂飯 PWA 安裝測試</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="../install-icon-192.png">
<style>
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;max-width:560px;margin:0 auto;padding:32px 20px;background:#fff8f2;color:#2a211e}
.card{background:#fff;border:1px solid #eadbd4;border-radius:20px;padding:22px;box-shadow:0 10px 30px #8d6e5d18}
img{width:96px;height:96px;border-radius:22px;display:block;margin-bottom:16px}
h1{font-size:24px;margin:0 0 10px}p{line-height:1.7}.status{padding:12px;border-radius:12px;background:#f8eee9;font-weight:700}
button{width:100%;border:0;border-radius:12px;padding:14px;background:#b97868;color:#fff;font-size:16px;font-weight:800;margin-top:14px}
button:disabled{opacity:.5}.small{font-size:13px;color:#806f68}
</style>
</head>
<body>
<div class="card">
<img src="../install-icon-192.png" alt="">
<h1>班級訂飯 PWA 安裝測試</h1>
<p>這頁只有最基本的 PWA 元件，用來判斷 Chrome 能不能建立真正的 WebAPK。</p>
<div id="status" class="status">正在檢查…</div>
<button id="install" disabled>等待 Chrome</button>
<p id="detail" class="small"></p>
</div>
<script>
let installEvent=null;
const status=document.getElementById('status');
const detail=document.getElementById('detail');
const btn=document.getElementById('install');

function standalone(){
  return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
}
async function update(){
  const regs='serviceWorker' in navigator ? await navigator.serviceWorker.getRegistrations().catch(()=>[]) : [];
  const mine=regs.find(r=>r.scope.endsWith('/class-lunch/install-test/'));
  detail.textContent='secure='+isSecureContext+' · SW='+(mine?'ready':'none')+' · standalone='+standalone()+' · UA='+navigator.userAgent;
  if(standalone()){
    status.textContent='已經以獨立 App 模式執行。';
    btn.disabled=true;
  }else if(installEvent){
    status.textContent='Chrome 已判定這個測試 PWA 可安裝。';
    btn.disabled=false;
    btn.textContent='安裝測試 App';
  }else{
    status.textContent='等待 Chrome 的 PWA 安裝事件…';
  }
}
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  installEvent=e;
  update();
});
window.addEventListener('appinstalled',()=>{
  status.textContent='Chrome 回報 App 已安裝。';
  installEvent=null;
  update();
});
btn.addEventListener('click',async()=>{
  if(!installEvent)return;
  const e=installEvent;
  installEvent=null;
  await e.prompt();
  const choice=await e.userChoice.catch(()=>null);
  status.textContent='安裝結果：'+(choice?.outcome||'unknown');
  await update();
});
(async()=>{
  if('serviceWorker' in navigator){
    try{
      const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
      await navigator.serviceWorker.ready;
      await reg.update().catch(()=>null);
    }catch(err){
      status.textContent='Service Worker 失敗：'+(err?.message||err);
    }
  }
  await update();
})();
</script>
</body>
</html>
